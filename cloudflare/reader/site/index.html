<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private WaveNet reader</title><link rel="stylesheet" href="reader.css">
<header><h1>Private WaveNet reader</h1><a href="/api/billing">Account and speech usage</a></header>
<main><p id="notice">Full preparation · WaveNet’s default pronunciation and pauses</p><label for="text">Reading text</label><textarea id="text" rows="12" placeholder="Paste your text here"></textarea>
<div class="controls"><label>Voice <select id="voice"><option value="en-US-Wavenet-F">US English</option><option value="en-GB-Wavenet-F">British English</option></select></label><label>Playback speed <select id="rate"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label><button id="sample" hidden>Load cached sample</button></div>
<div class="controls"><button id="play">Prepare and play</button><button id="pause" disabled>Pause</button><button id="resume" disabled>Resume</button><button id="stop" disabled>Stop</button><button id="previous" disabled>Previous section</button><button id="next" disabled>Next section</button></div>
<p id="status" role="status" aria-live="polite">Ready for text.</p><label for="seek">Position <span id="time">0:00 / 0:00</span></label><input id="seek" type="range" min="0" max="1" value="0" step="0.1" disabled>
<p id="downloads" hidden><a id="mp3">Download MP3</a> · <a id="vtt">Download captions</a></p><div id="reading" aria-label="Reading sections"></div></main><script type="module" src="reader.js"></script></html>
